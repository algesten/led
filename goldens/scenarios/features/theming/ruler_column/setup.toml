no_workspace = true

# A single 15-char line at row 0 plus empty rows below. The ruler
# sits at body column 8 — past the end of every row except row 0
# (text reaches col 14, hiding the ruler) — so empty rows render
# the `│` bar and row 0 keeps its glyphs intact.
[[file]]
path = "a.txt"
contents = "abcdefghijklmno\n"

[config]
theme = """
[chrome]
ruler_column = 8

[chrome.ruler]
fg = "dark_grey"
"""
