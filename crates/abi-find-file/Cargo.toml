[package]
name = "led-abi-find-file"
version = "0.0.0"
edition = "2024"
publish = false

# Shared ABI types for the find-file / save-as overlay driver — the
# wire shape returned by the prefix-filter directory listing. Lives in
# a leaf crate so `state-find-file` and `driver-find-file/core` can
# both depend on the same `FindFileEntry` definition without
# `state-find-file` pulling in the driver crate (three-tier
# dependency rule: `state-*` must not depend on `driver-*`).

[dependencies]
drv = { workspace = true }
led-core = { workspace = true }
