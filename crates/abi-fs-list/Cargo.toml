[package]
name = "led-abi-fs-list"
version = "0.0.0"
edition = "2024"
publish = false

# Shared ABI types for directory listings — the wire shape the FS-list
# driver emits and the file-browser state stores. Lives in a leaf crate
# so `state-browser` and `driver-fs-list/core` can both depend on the
# same `DirEntry` / `DirEntryKind` definitions without `state-browser`
# pulling in the driver crate (three-tier dependency rule:
# `state-*` must not depend on `driver-*`).

[dependencies]
led-core = { workspace = true }
