[package]
name = "led-driver-clipboard-core"
version = "0.0.0"
edition = "2024"
publish = false

# Sync core of the clipboard driver — portable. Holds the
# ClipboardAction / ClipboardCmd / ClipboardDone / Trace types, the
# driver-owned ClipboardState source (in-flight tracking + last
# error), and the main-loop-facing `ClipboardDriver` struct.
#
# Per EXAMPLE-ARCH § "Stateless drivers still need an in-flight
# source": this crate owns the in-flight bits so the user-decision
# crate `state-clipboard` is purely user choices (pending_yank,
# pending_write).

[dependencies]
drv = { workspace = true }
